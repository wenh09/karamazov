<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡拉马佐夫兄弟 · 视觉小说</title>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
 /* 帝俄剧院手册 · 烫金皮革装帧 */
 --ink:#101a2e;            /* 深墨蓝 主面 */
 --ink-2:#0b1220;         /* 更深墨蓝 */
 --ink-3:#16233d;        /* 墨蓝面板 */
 --leather:#2a1e13;      /* 烟草皮革 */
 --leather-2:#1e150d;
 --paper:#e9dfc6;        /* 象牙纸 */
 --paper-dim:#cdbf9e;
 --brass-hi:#ecd39a;     /* 黄铜亮 */
 --brass:#c9a86a;        /* 黄铜主 */
 --brass-dk:#8a6c3c;     /* 黄铜暗 */
 --ink-text:#ece1c6;     /* 深底象牙字 */
 --ink-text-dim:#b3a888;
 --ink-text-faint:#7e7663;
 --line:rgba(201,168,106,.42);
 --serif:"Noto Serif SC","Songti SC","STSong",serif;
 --latin:"EB Garamond",Georgia,serif;
 --tap:44px;
 --radius:3px;
 --btn-h:44px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--serif);background:var(--ink-2);color:var(--ink-text);line-height:1.7;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
#app{position:fixed;inset:0;overflow:hidden;}

/* ===== 组件：黄铜皮革键（统一 hover / 下压 / 选中 / disabled 哑铜） ===== */
.btn,.tbtn,#btnBar button,.cx-btn{
 font-family:var(--serif);
 background:linear-gradient(180deg,#33241a,#211710);
 border:1px solid var(--brass-dk);
 box-shadow:inset 0 1px 0 rgba(236,211,154,.26),inset 0 0 0 1px rgba(201,168,106,.16),inset 0 -3px 5px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.45);
 color:var(--paper);
 border-radius:var(--radius);
 letter-spacing:.12em;
 transition:border-color .15s ease,color .15s ease,box-shadow .15s ease,background .15s ease,transform .05s ease;
}
.btn:hover,.tbtn:hover,#btnBar button:hover,.cx-btn:hover{
 border-color:var(--brass-hi);color:#fff;
 box-shadow:inset 0 1px 0 rgba(236,211,154,.42),inset 0 0 0 1px rgba(201,168,106,.3),inset 0 -3px 5px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.5);
}
.btn:active,.tbtn:active,#btnBar button:active,.cx-btn:active{
 transform:translateY(1px);
 box-shadow:inset 0 3px 7px rgba(0,0,0,.72),inset 0 0 0 1px rgba(201,168,106,.2);
}
.btn:disabled,.tbtn:disabled,#btnBar button:disabled,.cx-btn:disabled{
 opacity:.5;cursor:not-allowed;color:var(--brass);
 background:linear-gradient(180deg,#241a12,#19120c);
 border-color:var(--brass-dk);
 box-shadow:inset 0 1px 0 rgba(201,168,106,.12);
}
#btnBar button.on,.tbtn.on{color:var(--brass-hi);border-color:var(--brass-hi);}

/* ===== 舞台：场景图 cover 铺满 ===== */
#bgLayer{position:absolute;inset:0;}
#bgLayer .bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 32%;display:none;}
#bgLayer .bg-img.on{display:block;}
#bgLayer .port-img{display:none;}
#app.flashback #bgLayer .bg-img.on{filter:sepia(.5) saturate(.7) brightness(.85);}
#app.dream #bgLayer .bg-img.on{filter:hue-rotate(200deg) saturate(.5) brightness(.8);}
#app.vision #bgLayer .bg-img.on{filter:contrast(1.15) saturate(.6) brightness(.75);}
#bgScrim{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(to bottom,rgba(6,9,16,.42) 0%,rgba(6,9,16,0) 22%,rgba(6,9,16,0) 52%,rgba(8,11,18,.66) 100%);}

/* ===== 顶部：地点牌 + 章节角标（轻量正常流） ===== */
#topBar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;z-index:6;pointer-events:none;}
#badge{background:linear-gradient(180deg,rgba(16,23,40,.92),rgba(11,17,32,.94));border:1px solid var(--brass-dk);border-top:2px solid var(--brass);padding:8px 16px;font-size:14px;color:var(--paper);letter-spacing:.04em;line-height:1.5;box-shadow:inset 0 1px 0 rgba(236,211,154,.15),0 2px 8px rgba(0,0,0,.4);}
#badge .sceneMood{font-size:12px;color:var(--paper-dim);margin-top:2px;}
#progLine{font-size:11.5px;color:var(--brass);letter-spacing:.14em;text-shadow:0 1px 2px #000;padding-top:4px;}
#modeTag{display:none;border:1px solid var(--brass-dk);background:var(--ink-3);padding:5px 12px;font-size:12px;letter-spacing:.1em;}
#modeTag.on{display:block;}
#modeTag.f{border-color:var(--brass);color:var(--brass-hi);}
#modeTag.d{border-color:#6f86b8;color:#a9bce0;}
#modeTag.v{border-color:#9a6fb0;color:#cfb0e0;}

/* ===== 右上按钮 ===== */
#topBtns{position:absolute;top:10px;right:12px;display:flex;gap:8px;z-index:7;}
.tbtn{min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
.newDot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:#d97757;opacity:0;}
#peopleBtn{position:relative;}#peopleBtn.hasNew .newDot{opacity:1;}

/* ===== 底部阅读面板（书页感） ===== */
#stage{position:absolute;inset:0;}
#dialogDock{position:absolute;left:0;right:0;bottom:0;min-height:26vh;max-height:44vh;
 background:linear-gradient(180deg,rgba(15,22,38,.92),rgba(9,13,24,.97));
 border-top:2px solid var(--brass);
 box-shadow:inset 0 1px 0 rgba(236,211,154,.28),0 -10px 28px rgba(0,0,0,.55);
 padding:30px 24px 78px;z-index:5;display:flex;flex-direction:column;}
#focus{position:absolute;left:22px;top:-70px;display:flex;gap:10px;align-items:flex-end;z-index:2;}
#focus.narrative,#focus.solo.narr{display:none;}
#dialogDock.nofocus #focus{display:none;}
#focus .fp{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
#focus .ava{width:88px;height:118px;overflow:hidden;border:1px solid var(--brass-dk);outline:1px solid rgba(236,211,154,.25);background:#111622;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.5);}
#focus .ava img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block;}
#focus .ava .ini{font-size:26px;color:var(--ink-text-dim);height:100%;display:flex;align-items:center;justify-content:center;}
#focus .ava .first{position:absolute;left:0;right:0;bottom:0;background:#7a4a2b;color:#fff;font-size:10px;text-align:center;padding:1px 0;}
#focus .fp.target .ava{width:56px;height:76px;opacity:.78;}
#focus .fp .nm{display:none;}
#focus .fp.target{opacity:.9;}
#focus .relTag{display:none;}
#nameplate{position:absolute;left:22px;top:-16px;background:linear-gradient(180deg,#16233d,#101a2e);border:1px solid var(--brass-dk);border-top:2px solid var(--brass);
 padding:4px 16px;font-size:14px;letter-spacing:.08em;color:var(--brass-hi);z-index:3;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5);}
#nameplate #name{font-weight:600;}
#nameplate #name.narr{color:var(--ink-text-faint);font-weight:400;}
#nameplate .tgtline{display:block;font-size:11.5px;color:var(--ink-text-dim);font-weight:400;letter-spacing:.03em;}

/* 正文区 */
#dlg{position:relative;flex:1;overflow-y:auto;padding-right:8px;}
#dlg.narr #text{color:var(--ink-text);text-align:center;max-width:46em;margin:0 auto;}
#leadNarr,#tailNarr{font-size:12.5px;color:var(--ink-text-dim);line-height:1.7;}
#leadNarr:empty,#tailNarr:empty{display:none;}
#text{font-size:17.5px;line-height:1.95;letter-spacing:.02em;color:var(--ink-text);}
#dlg.narr #text{font-size:16px;color:var(--ink-text-dim);}
#next{position:absolute;right:10px;bottom:-4px;font-size:16px;color:var(--brass);animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:.15;}}

/* ===== 底部按钮条（桌面：紧凑居中 8 列，≤760） ===== */
#btnBar{position:absolute;left:0;right:0;bottom:10px;z-index:8;margin:0 auto;width:min(760px,94vw);
 display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;}
#btnBar button{min-height:44px;font-size:14px;line-height:1.15;padding:4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;}

/* 进度条 */
#prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08);z-index:9;}
#prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--brass-dk),var(--brass-hi));}

/* ===== 浮层（剧院节目单） ===== */
.ov{position:absolute;inset:0;z-index:30;background:rgba(8,11,20,.97);display:none;overflow:auto;padding:32px 20px;}
.ov.open{display:block;}
.closex{position:absolute;top:14px;right:16px;min-width:var(--tap);min-height:var(--tap);font-size:20px;color:var(--ink-text-dim);z-index:5;border:1px solid var(--brass-dk);background:linear-gradient(180deg,#33241a,#211710);}
.closex:hover{color:var(--brass-hi);border-color:var(--brass-hi);}
.card{max-width:880px;margin:0 auto;color:var(--ink-text);}
.card h1{font-size:38px;font-weight:900;letter-spacing:.18em;text-align:center;margin-bottom:10px;color:var(--paper);}
.card h2{font-size:24px;letter-spacing:.1em;margin-bottom:14px;border-left:3px solid var(--brass);padding-left:10px;color:var(--paper);}
.card .sub{font-size:13px;color:var(--ink-text-dim);line-height:1.8;text-align:center;margin-bottom:18px;}
.card .note{font-size:12px;color:var(--ink-text-faint);margin-top:16px;line-height:1.7;border-top:1px solid var(--line);padding-top:10px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);padding:0 22px;font-size:15px;}

/* 标题菜单（桌面居中） */
#entryOv{display:none;align-items:center;justify-content:center;
 background:linear-gradient(180deg,rgba(11,18,32,.5),rgba(8,12,22,.86));}
#entryOv.open{display:flex;}
#entryOv .card{text-align:center;}
#entryOv .row{display:flex;flex-direction:column;gap:12px;align-items:center;margin:24px 0;}
#entryOv .btn{width:260px;min-height:48px;}

/* 回顾 */
.logItem{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-text-dim);line-height:1.8;}
.logItem b{color:var(--brass);font-weight:600;margin-right:8px;}

/* 图鉴 */
#codexSub{font-size:12px;color:var(--ink-text-faint);margin-bottom:10px;}
.pTabs{display:flex;gap:22px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.pTab{font-size:15px;color:var(--ink-text-faint);padding:8px 2px;border-bottom:2px solid transparent;}
.pTab.on{color:var(--brass);border-bottom-color:var(--brass);}
.sec{font-size:12px;color:var(--ink-text-faint);letter-spacing:.1em;margin:14px 0 6px;}
#codexList{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
#codexList .cx{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);cursor:pointer;background:linear-gradient(180deg,rgba(22,35,61,.4),rgba(16,26,46,.4));}
#codexList .cx:hover{border-color:var(--brass);}
#codexList .cx.locked{opacity:.45;}
#codexList .cx img{width:100%;height:130px;object-fit:cover;object-position:50% 15%;background:#111622;}
#codexList .cx .ci h3{font-size:14px;font-weight:600;color:var(--paper);}
#codexList .cx .ci p{font-size:11.5px;color:var(--ink-text-dim);line-height:1.5;}
#codexList .cx .ci .lk{font-size:11px;color:var(--ink-text-faint);}
#charDetail{display:none;}
#charDetail.open{display:block;}
#codexGridMode{display:block;}
#codexGridMode.off{display:none;}
.cdHead{display:flex;gap:18px;align-items:flex-start;margin-bottom:14px;}
.cdHead img{width:120px;height:160px;object-fit:cover;object-position:50% 15%;border:1px solid var(--brass-dk);outline:1px solid rgba(236,211,154,.25);background:#111622;}
.cdHead .cdInfo h2{border:0;padding:0;margin-bottom:6px;}
.cdRel{display:block;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink-text-dim);font-size:13px;}
.cdRel:hover{color:var(--brass);}

/* 章节 */
.arcItem{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;cursor:pointer;}
.arcItem:hover{color:var(--brass);}
.arcItem.locked{opacity:.4;cursor:default;}
.arcItem.cur{color:var(--brass);}
.arcItem h3{font-size:16px;font-weight:400;}
.arcItem .ab{font-size:12px;color:var(--ink-text-faint);}

/* 存档位 */
#saveSlots{display:flex;flex-direction:column;gap:12px;padding-bottom:80px;margin-bottom:16px;}
.slot{display:flex;gap:14px;border:1px solid var(--line);padding:10px;cursor:pointer;align-items:stretch;background:linear-gradient(180deg,rgba(22,35,61,.4),rgba(16,26,46,.4));}
.slot:hover{border-color:var(--brass);}
.slot img{width:120px;height:70px;object-fit:cover;background:#111622;flex:none;}
.slot .si{flex:1;min-width:0;}
.slot .si h4{font-size:14px;color:var(--brass);margin-bottom:4px;}
.slot .si p{font-size:12px;color:var(--ink-text-dim);line-height:1.6;}
.slot .empty{color:var(--ink-text-faint);font-size:13px;align-self:center;}

/* 关系图 */
#mapWrap{display:flex;flex-direction:column;gap:10px;}
#mapFilters{display:flex;gap:14px;flex-wrap:wrap;}
.mapFilter{font-size:12px;color:var(--ink-text-faint);padding:4px 0;border-bottom:1px solid transparent;}
.mapFilter.on{color:var(--brass);border-bottom:1px solid var(--brass);}
#relationMap{position:relative;width:100%;height:520px;background:rgba(255,255,255,.02);border:1px solid var(--line);}
#relationMap svg{width:100%;height:100%;}
.mapNode .ring{fill:var(--ink-3);stroke:var(--brass);stroke-width:1.5;}
.mapNode.faded .ring{opacity:.25;}
.mapNode.selected .ring{stroke:var(--brass-hi);stroke-width:3;}
.mapNode text{font-family:var(--serif);fill:var(--ink-text);font-size:13px;text-anchor:middle;}
.mapNode.faded text{opacity:.3;}
.mapEdge{fill:none;stroke-width:2;opacity:.7;}
.mapEdge.focused{opacity:1;}
.mapEmpty{padding:60px 0;text-align:center;color:var(--ink-text-faint);}
#mapLegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-text-faint);}
#mapLegend i{display:inline-block;width:16px;height:2px;margin-right:5px;vertical-align:middle;background:var(--c);}
#mapDetail{border-top:1px solid var(--line);padding-top:12px;}
#mapDetail h3{font-size:18px;color:var(--brass);margin-bottom:6px;}
#mapDetail p{font-size:13px;color:var(--ink-text-dim);line-height:1.6;margin-bottom:8px;}
#mapDetail button{display:block;width:100%;text-align:left;font-size:13px;color:var(--ink-text-dim);padding:6px 0;border-bottom:1px solid var(--line);}
#mapDetail button:hover{color:var(--brass);}
#mapSub{font-size:12px;color:var(--ink-text-faint);}

/* 场景标题过场 */
#sceneCard{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at center,rgba(6,9,16,.62) 0%,rgba(6,9,16,.2) 70%,rgba(6,9,16,0) 100%);
 pointer-events:none;}
#sceneCard.show{display:flex;animation:scFade 2.2s ease forwards;}
#sceneCardInner{text-align:center;}
#sceneCardInner h2{font-size:30px;letter-spacing:.25em;color:var(--paper);text-shadow:0 2px 12px rgba(0,0,0,.8);font-weight:600;}
#sceneCardInner .scTime{font-size:13px;color:var(--brass);margin-top:10px;letter-spacing:.3em;}
@keyframes scFade{0%{opacity:0;}15%{opacity:1;}75%{opacity:1;}100%{opacity:0;}}

/* 减弱动效：取消所有 transform 下压 */
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;}
 #btnBar button:active,.btn:active,.tbtn:active,.cx-btn:active{transform:none!important;}
}
</style>
</head>

—却看清，这是郑重其事的一拜。","lead":"","tail":"","rev":["alyosha","dmitri","zosima"],"kn":"众人一怔。","cast":["zosima","dmitri"],"srcIds":["s11b1","s11b2","s11b3"]},{"id":"s11b4","sc":"s11","arc":"a2","bg":"place-s11","sp":"zosima","txt":"别了。诸位，都请原谅我。","lead":"","tail":"","rev":[],"kn":"他向众人告别。","cast":["zosima","dmitri"],"srcIds":["s11b4"]},{"id":"s11b5","sc":"s11","arc":"a2","bg":"place-s11","sp":"dmitri","txt":"德米特里愣住，半晌从牙缝里挤出一句：……上帝啊。","lead":"","tail":"德米特里忽然捂住脸，转身冲出门去。满屋宾客，也乱哄哄跟着退了出来。","rev":[],"kn":"他被这一拜击溃。","cast":["zosima","dmitri"],"srcIds":["s11b5","s11b6"]},{"id":"sa1b1","sc":"sa1","arc":"a2","bg":"place-monastery-refectory","sp":"narrator","txt":"伏地一拜之后，宾客们被请进院长食堂用素餐。米乌索夫憋了一肚子火，一心想找院长理论。","lead":"","tail":"","rev":["alyosha","fyodor","ivan","miusov"],"kn":"餐桌闹剧紧接伏地一拜之后。","cast":["miusov"],"srcIds":["sa1b1"]},{"id":"sa1b2","sc":"sa1","arc":"a2","bg":"place-monastery-refectory","sp":"miusov","txt":"恕我直言，贵院的规矩未免过于宽纵——听说连鱼肉都不禁？","lead":"","tail":"院长还未答，费奥多尔已抢着接话，把一句客套话演成了一场滑稽戏，满屋人或皱眉或掩笑。","rev":[],"kn":"他拿斋戒规矩开刀。","cast":["miusov"],"srcIds":["sa1b2","sa1b3"]},{"id":"sa1b4","sc":"sa1","arc":"a2","bg":"place-monastery-refectory","sp":"miusov","txt":"够了！这桌我吃不下去——告辞！","lead":"","tail":"一顿饭就此不欢而散。阿辽沙随长老回隐修所，心里明白：这座小城从此要被卡拉马佐夫家搅得天翻地覆。","rev":[],"kn":"米乌索夫愤然离席。","cast":["miusov"],"srcIds":["sa1b4","sa1b5"]},{"id":"sa2b1","sc":"sa2","arc":"a3","bg":"servant_lodge","sp":"narrator","txt":"费奥多尔的城宅远在城边，两层灰楼、红铁顶；夜里他总把仆人赶去下房，独自锁在楼里。下房里只住三个人：老仆人格里戈里、他妻子玛尔法，还有一个叫斯乜尔佳科夫的年轻厨子。城里早有闲话：这青年是当年那个冻死在围墙上的'臭丽萨薇塔'的儿子，父亲是谁，人人心里有数。","lead":"","tail":"","rev":["grigory","marfa","smerdyakov"],"kn":"这是父亲的家。","cast":["grigory"],"srcIds":["sa2b1","sa2b2","sa2b3"]},{"id":"sa2b4","sc":"sa2","arc":"a3","bg":"servant_lodge","sp":"grigory","txt":"本分就是本分。他再荒唐，也是我们的东家，守着便是。","lead":"","tail":"楼上，费奥多尔正就着白兰地盘问伊万；斯乜尔佳科夫端菜进出，耳朵却比谁都尖。","rev":[],"kn":"老仆以忠诚自守。","cast":["grigory"],"srcIds":["sa2b4","sa2b5"]},{"id":"sa3b1","sc":"sa3","arc":"a3","bg":"place-willow-night","sp":"narrator","txt":"德米特里从修道院冲出来后，半路截住弟弟阿辽沙，把他拉到一边，非要把压在心里的事一五一十倒出来。","lead":"","tail":"","rev":["alyosha","dmitri"],"kn":"米嘉对阿辽沙剖白。","cast":["dmitri","alyosha"],"srcIds":["sa3b1"]},{"id":"sa3b2","sc":"sa3","arc":"a3","bg":"place-willow-night","sp":"dmitri","txt":"我这人荒唐，可荒唐得也有分寸——有些脏事我宁可写诗，也不愿真做。当年我在部队里，遇上一位上校的女儿……我竟当众羞辱了她。","lead":"","tail":"他讲自己怎样把四千五百卢布送到她家门口、又怎样第二天清醒过来羞愧难当；姑娘反倒差人把找零送了回来，一个字没有。","rev":[],"kn":"他自称有底线。","cast":["dmitri","alyosha"],"srcIds":["sa3b2","sa3b3","sa3b4"]},{"id":"sa3b5","sc":"sa3","arc":"a3","bg":"place-willow-night","sp":"dmitri","txt":"后来她成了富家继承人，寄来钱、寄来信——她说：'嫁给我吧，我什么都听你的。'","lead":"","tail":"","rev":["katerina"],"kn":"卡捷琳娜主动许身。","cast":["dmitri","alyosha"],"srcIds":["sa3b5"]},{"id":"sa3b6","sc":"sa3","arc":"a3","bg":"place-willow-night","sp":"alyosha","txt":"那你为什么又……?","lead":"","tail":"","rev":[],"kn":"他不明白兄长为何变心。","cast":["dmitri","alyosha"],"srcIds":["sa3b6"]},{"id":"sa5b1","sc":"sa5","arc":"a3","bg":"place-grushenka-parlor","sp":"narrator","txt":"全城都知道：费奥多尔和他亲儿子德米特里，如今在争同一个女人——本地富孀格鲁申卡。费奥多尔已经备好三千卢布，只等她点头；德米特里也为这笔钱发疯，四处借钱、抵押。","lead":"","tail":"","rev":["fyodor","grushenka"],"kn":"父子同争一女。","cast":["fyodor","dmitri"],"srcIds":["sa5b1","sa5b2"]},{"id":"sa5b3","sc":"sa5","arc":"a3","bg":"place-grushenka-parlor","sp":"grushenka","txt":"你们爷俩呀，一个比一个可笑——我可还没拿定主意呢。","lead":"","tail":"米嘉闯进来，看见父亲也在，两人立刻剑拔弩张；格鲁申卡反倒起身离座，由着他们斗。阿辽沙站在门外，看见兄长攥拳、父亲龇牙，只觉得这家人的羞耻已到顶点。","rev":[],"kn":"她在两头钓。","cast":["grushenka"],"srcIds":["sa5b3","sa5b4","sa5b5"]},{"id":"sa4b1","sc":"sa4","arc":"a3","bg":"place-katerina-lodging","sp":"narrator","txt":"德米特里带阿辽沙去见卡捷琳娜·伊万诺芙娜。她在一位远亲家中作客，屋子素净、白窗帘。","lead":"","tail":"","rev":["alyosha","dmitri","katerina"],"kn":"正式会面。","cast":["katerina","dmitri"],"srcIds":["sa4b1"]},{"id":"sa4b2","sc":"sa4","arc":"a3","bg":"place-katerina-lodging","sp":"katerina","txt":"我听说您今天在修道院大闹了一场。我只问一句：您还打算把我当什么？","lead":"","tail":"","rev":[],"kn":"她高傲而受伤。","cast":["katerina","dmitri"],"srcIds":["sa4b2"]},{"id":"sa4b3","sc":"sa4","arc":"a3","bg":"place-katerina-lodging","sp":"dmitri","txt":"我……我对不起您。可我心里另有人了。","lead":"","tail":"卡捷琳娜没有立刻发作，反而从信封里抽出一大笔钞票，当着兄弟俩的面，把钱扔到米嘉脚边。","rev":[],"kn":"他当面承认变心。","cast":["katerina","dmitri"],"srcIds":["sa4b3","sa4b4"]},{"id":"sa4b5","sc":"sa4","arc":"a3","bg":"place-katerina-lodging","sp":"katerina","txt":"这是您当年那笔钱——现在，连本带利，还给您。","lead":"","tail":"米嘉脸色煞白，弯腰把钱拾起，又狠狠摔回给她；阿辽沙站在一旁，连气都不敢出。","rev":[],"kn":"她要以此割断关系。","cast":["katerina","dmitri"],"srcIds":["sa4b5","sa4b6"]},{"id":"sa6b1","sc":"sa6","arc":"a4","bg":"place-zosima-cell","sp":"narrator","txt":"次日天未亮，阿辽沙被人唤起——长老夜里很不舒服，想立刻领圣体、行终傅。帕伊西神父主持告解，修士们围拢；长老脸色疲倦，眼神却仍明亮，像在欢喜。隔壁破旧小室里，另一位老修士费拉邦特正对着墙角自语、连饭也不肯好好吃；有人说他是圣徒，有人说他是疯子。","lead":"","tail":"","rev":["alyosha","ferapont","paissy","zosima"],"kn":"长老病危。","cast":["zosima"],"srcIds":["sa6b1","sa6b2","sa6b3"]},{"id":"sa6b4","sc":"sa6","arc":"a4","bg":"place-zosima-cell","sp":"zosima","txt":"我讲了一辈子道，如今话到嘴边反而比缄默容易。","lead":"","tail":"阿辽沙跪在椅边，听长老断断续续地说，只觉得每一句都像在把他往后的路先铺好。","rev":[],"kn":"他要把一生的话留下。","cast":["zosima"],"srcIds":["sa6b4","sa6b5"]},{"id":"sa7b1","sc":"sa7","arc":"a4","bg":"snegiryov_room","sp":"narrator","txt":"卡捷琳娜托阿辽沙：悄悄去周济那个被米嘉当众揪着胡子拖过街的落魄上尉一家。阿辽沙摸进破屋：病弱的妻、几个面黄肌瘦的孩子，上尉斯涅吉辽夫窘迫得抬不起头。","lead":"","tail":"","rev":["ilyusha"],"kn":"孩子线由这桩当众之辱而起。","cast":["snegiryov","alyosha"],"srcIds":["sa7b1","sa7b2"]},{"id":"sa7b3","sc":"sa7","arc":"a4","bg":"snegiryov_room","sp":"snegiryov","txt":"上尉盯着那两张钞票，忽然一把攥住，又狠狠揉成一团摔在地上——这施舍比那顿打更刺他。","lead":"","tail":"躲在父亲腿后的小男孩伊柳沙，死死瞪着阿辽沙；这股羞辱，从此埋进了孩子心里。","rev":[],"kn":"自尊被再次碾伤。","cast":["snegiryov","ilyusha","alyosha"],"srcIds":["sa7b3","sa7b4"]},{"id":"sa8b1","sc":"sa8","arc":"a4","bg":"place-schoolyard","sp":"narrator","txt":"阿辽沙从修道院出来，路过小学校院，看见一群小学童围着一个瘦小的孩子扔石头骂他。阿辽沙蹲下身去劝，那瘦小孩却抓起石子，死死瞪了他一眼，转身哭着跑了。","lead":"","tail":"","rev":["alyosha","ilyusha"],"kn":"他为孩子出头。","cast":["alyosha"],"srcIds":["sa8b1","sa8b2"]},{"id":"sa8b3","sc":"sa8","arc":"a4","bg":"place-schoolyard","sp":"alyosha","txt":"（低声）这孩子……心里也有他自己的委屈。","lead":"","tail":"几个大孩子站住了，好奇地打量这位修士打扮的年轻人；他们还不知道，这个倔强的孩子，日后会牵动阿辽沙整颗心。","rev":[],"kn":"他没有生气。","cast":["alyosha"],"srcIds":["sa8b3","sa8b4"]},{"id":"sa9b1","sc":"sa9","arc":"a4","bg":"kholokolov_house","sp":"narrator","txt":"阿辽沙依约到霍赫拉科娃夫人家。夫人迎上来，又惊又急：卡捷琳娜正在客厅，伊万也在，两人说话说到让人揪心。阿辽沙隔门看见：卡捷琳娜正对伊万倾身说话，神色又傲又痛；伊万稳坐，目光冷静。随后他被领进莉兹的小房间。轮椅上的小姑娘脸颊通红，把一张折好的纸条塞到他手里。","lead":"","tail":"","rev":["alyosha","ivan","katerina","khokhlakov","lise"],"kn":"卡捷琳娜与伊万独处。","cast":["lise"],"srcIds":["sa9b1","sa9b2","sa9b3"]},{"id":"sa9b4","sc":"sa9","arc":"a4","bg":"kholokolov_house","sp":"lise","txt":"您……请一定看。等您走了再看。","lead":"","tail":"阿辽沙走出石楼时，心里装着两件事：卡捷琳娜与伊万那危险的沉默，和莉兹塞来的那张纸条。","rev":[],"kn":"少女心事初露。","cast":["lise"],"srcIds":["sa9b4","sa9b5"]},{"id":"psv3b1","sc":"p-supp-v3","arc":"a5","bg":"quiet_tavern","sp":"narrator","txt":"伊万约阿辽沙在酒馆坐下，说要在动身离开前，把彼此认识清楚。","lead":"","tail":"","rev":[],"kn":"兄弟多年疏远，今首次交心。","cast":["ivan","alyosha"],"srcIds":["psv3b1"]},{"id":"psv3b2","sc":"p-supp-v3","arc":"a5","bg":"quiet_tavern","sp":"ivan","txt":"还记得你小时候爱樱桃酱吗？我记得你才十一，我十五。","lead":"","tail":"兄弟俩喝汤吃酱，说起这些年的疏远；阿辽沙第一次真正走近二哥。伊万话锋一转，说起父亲与德米特里那笔三千卢布的烂账——他已被卷进家里的泥淖。","rev":[],"kn":"伊万其实一直记得弟弟。","cast":["ivan","alyosha"],"srcIds":["psv3b2","psv3b3","psv3b4"]},{"id":"psv3b5","sc":"p-supp-v3","arc":"a5","bg":"quiet_tavern","sp":"alyosha","txt":"你为什么这样一直看着我？阿辽沙问。伊万笑了：因为你是个站得稳的小人儿。","lead":"","tail":"茶喝完，伊万才放下玩笑，说出那句让阿辽沙心惊的自白——于是有了后来的叛逆与长诗。","rev":[],"kn":"伊万开始尊重阿辽沙。","cast":["ivan","alyosha"],"srcIds":["psv3b5","psv3b6"]},{"id":"sa10b1","sc":"sa10","arc":"a5","bg":"quiet_tavern","sp":"narrator","txt":"傍晚，伊万约阿辽沙在一家小馆子坐下，几杯酒后，他终于把压在心里的话摊开。","lead":"","tail":"","rev":["alyosha","ivan"],"kn":"兄弟夜谈开始。","cast":["ivan","alyosha"],"srcIds":["sa10b1"]},{"id":"sa10b2","sc":"sa10","arc":"a5","bg":"quiet_tavern","sp":"ivan","txt":"我没法爱邻居——人一露脸，爱就没了。我不是不信上帝，我是把这个世界，原样退回给他。","lead":"","tail":"他说起一个受虐待的孩子、一个被将军放狗咬死的农奴幼童；他说，若这一切是为了将来的'和谐'，他不配领那张票。","rev":[],"kn":"他的'叛逆'是拒受这个世界。","cast":["ivan","alyosha"],"srcIds":["sa10b2","sa10b3"]},{"id":"sa10b4","sc":"sa10","arc":"a5","bg":"quiet_tavern","sp":"alyosha","txt":"哥哥……你这是 sa12b1","sc":"sa12","arc":"a6","bg":"place-zosima-cell","sp":"narrator","txt":"长老靠在椅上，声音虽弱，却一段一段地讲起自己的一生：哥哥早逝、从军、决斗、险些杀人，后来怎样在修道院里换了心。","lead":"","tail":"","rev":["alyosha","zosima"],"kn":"他开始口述生平。","cast":["zosima"],"srcIds":["sa12b1"]},{"id":"sa12b2","sc":"sa12","arc":"a6","bg":"place-zosima-cell","sp":"zosima","txt":"我年轻时也骄傲、也凶狠；是一个老修道士一句话点醒了我：'为一切人、一切事，你都是有罪的。'","lead":"","tail":"他讲到对农人的爱、对死者的追忆、对阿辽沙的嘱咐：不要离开修道院，也不要恨这世界。","rev":[],"kn":"他的核心教训：人人互担罪责。","cast":["zosima"],"srcIds":["sa12b2","sa12b3"]},{"id":"sa12b4","sc":"sa12","arc":"a6","bg":"place-zosima-cell","sp":"zosima","txt":"（轻声）去爱人，不停歇地爱；哪怕对人有罪，也要当他们是无辜的。","lead":"","tail":"围聚的修士们都垂首不语。油灯将尽，长老握着阿辽沙的手，把余下的话都留给了沉默。","rev":[],"kn":"这是他留给阿辽沙的钥匙。","cast":["zosima"],"srcIds":["sa12b4","sa12b5"]},{"id":"b_s1_b1","sc":"b_s1","arc":"a7","bg":"skete_coffin_cell","sp":"narrator","txt":"长老咽气不到一天，隐修所里起了议论。遗体没有像众人所盼的那样散发出馨香，反而透出腐味。客居的修士们挤在门口，压低声音嘲笑；连一向敬重长老的见习修士也变了脸色。","lead":"","tail":"","rev":["alyosha","rakitin"],"kn":"客观：长老遗体出现腐败气味。众人期待'圣者遗体不腐'，结果相反。","cast":["rakitin"],"srcIds":["b_s1_b1","b_s1_b2"]},{"id":"b_s1_b3","sc":"b_s1","arc":"a7","bg":"skete_coffin_cell","sp":"rakitin","txt":"看见没有？你那位圣人，连一点奇迹也没留下。","lead":"","tail":"阿辽沙站在棺旁，心里像被谁砸开一个洞。他不是不信长老，他只是撑不住了。","rev":[],"kn":"拉基金在讥讽长老的'神迹'期待落空。","cast":["rakitin"],"srcIds":["b_s1_b3","b_s1_b4"]},{"id":"b_s2_b1","sc":"b_s2","arc":"a7","bg":"monastery_copse","sp":"narrator","txt":"他一个人在松林小路上走，脚下是干松针。拉基金从树后闪出来，像早等着他。","lead":"","tail":"","rev":["rakitin"],"kn":"客观：拉基金主动来寻阿辽沙。","cast":["rakitin"],"srcIds":["b_s2_b1"]},{"id":"b_s2_b2","sc":"b_s2","arc":"a7","bg":"monastery_copse","sp":"rakitin","txt":"你心里堵，我懂。走，我请你喝一壶茶，顺便去看个热闹。","lead":"","tail":"阿辽沙没有力气拒绝。他像被风牵着，跟着这个机灵的、嘴上不饶人的见习修士下了山。","rev":[],"kn":"拉基金要带阿辽沙进城去格鲁申卡家。","cast":["rakitin"],"srcIds":["b_s2_b2","b_s2_b3"]},{"id":"b_s2_b4","sc":"b_s2","arc":"a7","bg":"monastery_copse","sp":"rakitin","txt":"你师傅不在了，往后这院里就没人护着你了。跟我学学怎么在世上过日子，啊？","lead":"","tail":"","rev":[],"kn":"拉基金在试探阿辽沙的信仰底线。","cast":["rakitin"],"srcIds":["b_s2_b4"]},{"id":"b_s3_b1","sc":"b_s3","arc":"a7","bg":"grushenka_house","sp":"narrator","txt":"格鲁申卡的小屋收拾得干净。她坐在沙发上，裹着披肩，看见年轻修士进门，先笑出了声。","lead":"","tail":"","rev":["grushenka"],"kn":"格鲁申卡收起钓客的轻佻，第一次对年轻修士卸下防备。","cast":["grushenka","rakitin"],"srcIds":["b_s3_b1"]},{"id":"b_s3_b2","sc":"b_s3","arc":"a7","bg":"grushenka_house","sp":"grushenka","txt":"哟，长老派来的小修士也上我这种人家来了？来，坐近点，别害怕我。","lead":"","tail":"","rev":[],"kn":"格鲁申卡惯于调戏正经人。","cast":["grushenka","rakitin"],"srcIds":["b_s3_b2"]},{"id":"b_s3_b3","sc":"b_s3","arc":"a7","bg":"grushenka_house","sp":"rakitin","txt":"他师傅刚死，心里正难过呢。","lead":"","tail":"格鲁申卡听完，没再笑。她伸手从碟子里拿了一颗核桃塞进阿辽沙手里。","rev":[],"kn":"拉基金故意把场面搅浑。","cast":["grushenka","rakitin"],"srcIds":["b_s3_b3","b_s3_b4"]},{"id":"b_s3_b5","sc":"b_s3","arc":"a7","bg":"grushenka_house","sp":"grushenka","txt":"小修士，你记住我今天这颗洋葱——我也不是完全坏透的女人。","lead":"","tail":"","rev":[],"kn":"她用'一颗洋葱'自嘲，对应后面'一个洋葱'的故事。","cast":["grushenka","rakitin"],"srcIds":["b_s3_b5"]},{"id":"b_s4_b1","sc":"b_s4","arc":"a7","bg":"monastery_garden_night","sp":"narrator","txt":"他回到修道院，躺在长老棺旁的地板上。白天的议论、格鲁申卡的笑、那一颗核桃，在脑子里搅成一团。他低声念着长老生前所讲过的话，念着念着，意识飘开，做起梦来。","lead":"","tail":"","rev":["alyosha"],"kn":"客观：阿辽沙回到棺旁。","cast":[],"srcIds":["b_s4_b1","b_s4_b2"]},{"id":"b_s4_b3","sc":"b_s4","arc":"a7","bg":"monastery_garden_night","sp":"narrator","txt":"他梦见迦拿的婚宴。客人们坐满，酒用尽了，母亲们说没有酒了；主人说，把缸倒满吧。他醒来，泪如雨下。他扑倒在地，亲吻修道院的泥土，又笑着站起来。他心里不再追问长老的遗体为什么没有发光。他只想着要走到人中间去，去做事。","lead":"","tail":"","rev":[],"kn":"这是阿辽沙的梦，不是真实场景；他把长老的话和福音故事叠在一起。","cast":[],"srcIds":["b_s4_b3","b_s4_b4","b_s4_b5"]},{"id":"b_s5_b1","sc":"b_s5","arc":"a8","bg":"samsonov_house","sp":"narrator","txt":"同一时刻，城里另一头。德米特里疯了似的跑进老商人萨姆索诺夫的家。他要三千卢布。","lead":"","tail":"","rev":["dmitri","samsonov"],"kn":"客观：米嘉急需三千卢布。他自己说，这钱是为了还给卡捷琳娜·伊万诺芙娜，好堂堂正正离开她，再去找格鲁申卡。","cast":["dmitri","samsonov"],"srcIds":["b_s5_b1"]},{"id":"b_s5_b2","sc":"b_s5","arc":"a8","bg":"samsonov_house","sp":"dmitri","txt":"库兹马·库兹米奇，我把我那份田产押给你，只要三千，过两天我连本带利还！","lead":"","tail":"","rev":[],"kn":"米嘉自述：他愿以田产作抵押借钱。","cast":["dmitri","samsonov"],"srcIds":["b_s5_b2"]},{"id":"b_s5_b3","sc":"b_s5","arc":"a8","bg":"samsonov_house","sp":"samsonov","txt":"田产？你那份田早不在你手里了。这样——你去找里亚戈维，他在外面庄子上，你把那片小树林卖给他，他或许肯出几个钱。","lead":"","tail":"米嘉没听出这话里的玩笑。他如获至宝，鞠了一躬就往外跑。他以为这是一根救命稻草。","rev":[],"kn":"客观：萨姆索诺夫没有借钱，而是把米嘉支去里亚戈维那里。米嘉后来才明白这是句玩笑话。","cast":["dmitri","samsonov"],"srcIds":["b_s5_b3","b_s5_b4"]},{"id":"b_s6_b1","sc":"b_s6","arc":"a8","bg":"road_to_lyagavy","sp":"narrator","txt":"米嘉连夜租了三套马车，赶去几十里外的庄子找里亚戈维。夜路颠簸，他怀里揣着最后一点钱。他到了客栈，里亚戈维早喝得烂醉，蜷在长凳上睡死。米嘉守到天亮，那人睁了睁眼，又醉倒过去。","lead":"","tail":"","rev":["dmitri","lyagavy"],"kn":"客观：米嘉连夜赶路。","cast":[],"srcIds":["b_s6_b1","b_s6_b2"]},{"id":"b_s6_b3","sc":"b_s6","arc":"a8","bg":"road_to_lyagavy","sp":"narrator","txt":"他这才明白萨姆索诺夫是在耍他。他坐在台阶上，把脸埋进手掌。钱没借到，天已经亮了。他跳上回程的马车，脑子里只剩一个念头：她要是真在父亲那儿，他今晚就要去把她夺回来。","lead":"","tail":"","rev":[],"kn":"客观：筹款失败，他只剩最后一条路。","cast":[],"srcIds":["b_s6_b3","b_s6_b4"]},{"id":"b_s7_b1","sc":"b_s7","arc":"a8","bg":"fyodor_garden_window","sp":"narrator","txt":"他又连夜赶回来。半夜，他翻过父亲家的花园矮墙，躲在窗边的灌木后。他要确认格鲁申卡是不是在父亲屋里。父亲一个人走到窗边，向外张望。米嘉屏住呼吸。父亲做了一个手势——米嘉后来一口咬定那是在示意格鲁申卡进来。","lead":"","tail":"","rev":["dmitri","fyodor"],"kn":"客观：米嘉潜入父亲花园。他自己后来在预审中承认这一点。","cast":["dmitri","fyodor"],"srcIds":["b_s7_b1","b_s7_b2"]},{"id":"b_s7_b3","sc":"b_s7","arc":"a8","bg":"fyodor_garden_window","sp":"narrator","txt":"他从抽屉里摸出那个铜研杵，攥在手里。他对自己说，我不是来杀人的，我只是来确认她在不在。屋里没有格鲁申卡的声音。父亲伸头看了一会儿，缩回屋去，窗也跟着合上。","lead":"","tail":"","rev":[],"kn":"客观：他随身带了凶器。","cast":["dmitri","fyodor"],"srcIds":["b_s7_b3","b_s7_b4"]},{"id":"b_s8_b1","sc":"b_s8","arc":"a8","bg":"fyodor_garden_window","sp":"narrator","txt":"他刚要翻出墙外，老仆格里戈里从暗处扑出来，抱住他的腿。","lead":"","tail":"","rev":["grigory"],"kn":"客观：格里戈里在花园守夜。","cast":["grigory","dmitri"],"srcIds":["b_s8_b1"]},{"id":"b_s8_b2","sc":"b_s8","arc":"a8","bg":"fyodor_garden_window","sp":"grigory","txt":"你这个杀父的孽种！我看你往哪儿跑——","lead":"","tail":"米嘉抡起铜研杵，一击砸在老人头上。格里戈里像一截木头似的倒下去，血顺着草叶漫开。米嘉蹲下去摸他的鼻息，手抖着。他以为自己杀了人。他在衣襟上擦干净研杵上的血，翻墙逃走。","rev":[],"kn":"格里戈里认出米嘉并高声喊他'杀父孽种'。","cast":["grigory","dmitri"],"srcIds":["b_s8_b2","b_s8_b3","b_s8_b4"]},{"id":"b_s9_b1","sc":"b_s9","arc":"a8","bg":"perhotin_house","sp":"narrator","txt":"他没有回家。他先跑到年轻官员彼尔霍金那里，把身上仅剩的几张大票子换成零钱。","lead":"","tail":"","rev":["dmitri","perhotin"],"kn":"客观：米嘉在彼尔霍金处换钱。","cast":["perhotin","dmitri"],"srcIds":["b_s9_b1"]},{"id":"b_s9_b2","sc":"b_s9","arc":"a8","bg":"perhotin_house","sp":"perhotin","txt":"德米特里·费奥多罗维奇，你这一身血是怎么回事？","lead":"","tail":"","rev":[],"kn":"客观：米嘉衣袖带血被旁人看见。","cast":["perhotin","dmitri"],"srcIds":["b_s9_b2"]},{"id":"b_s9_b3","sc":"b_s9","arc":"a8","bg":"perhotin_house","sp":"dmitri","txt":"血？没什么。我……我马上要去一个地方。给我备车。","lead":"","tail":"他冲去格鲁申卡的小屋，门却锁着。邻居告诉他，她跟一个波兰客人上莫克罗耶去了。他几乎笑出声来。她在那儿，他也去。他把换开的钱往怀里一揣，跳上马车。","rev":[],"kn":"米嘉没有对彼尔霍金说实话。","cast":["perhotin","dmitri"],"srcIds":["b_s9_b3","b_s9_b4","b_s9_b5"]},{"id":"b_s10_b1","sc":"b_s10","arc":"a8","bg":"mokroye_tavern","sp":"narrator","txt":"莫克罗耶村的酒馆大厅。格鲁申卡坐在波兰客人身边，穿着好裙子，眼神却一直往门口瞟。米嘉推门进来。他没有扑上去闹。他在格鲁申卡对面坐下，像换了一个人。","lead":"","tail":"","rev":["dmitri","grushenka","the_pole"],"kn":"客观：她原本随波兰人来寻欢。","cast":["grushenka"],"srcIds":["b_s10_b1","b_s10_b2"]},{"id":"b_s10_b3","sc":"b_s10","arc":"a8","bg":"mokroye_tavern","sp":"grushenka","txt":"你怎么也跟来了？你这是要干什么？","lead":"","tail":"他掏出大把钞票拍在桌上，请整间酒馆喝酒、请吉普赛人唱歌。掌柜特里丰·鲍里索维奇眼睛都亮了。他对格鲁申卡说，他明天一早就去自首——如果今天夜里她肯陪他坐到天亮。酒、歌、火光。他半醉半醒，以为这就是他最后一夜。","rev":[],"kn":"格鲁申卡没料到他追来。","cast":["grushenka"],"srcIds":["b_s10_b3","b_s10_b4","b_s10_b5","b_s10_b6"]},{"id":"b_s11_b1","sc":"b_s11","arc":"a9","bg":"mokroye_tavern","sp":"narrator","txt":"天没亮，酒馆门被人推开。县里警官、预审推事尼古拉·帕尔菲诺维奇、检察官伊波利特·基里洛维奇，带着几名法警走了进来。米嘉起初不肯信。等他明白过来，脸一下子灰了。他没有反抗，伸出手让法警上铐。","lead":"","tail":"","rev":["dmitri","kirillovitch","nikolay_parfenovitch"],"kn":"客观：父亲费奥多尔昨夜被人发现死在自家花园里。这一消息此刻第一次传到米嘉耳中。","cast":["dmitri","kirillovitch","nikolay_parfenovitch"],"srcIds":["b_s11_b1","b_s11_b2"]},{"id":"b_s11_b3","sc":"b_s11","arc":"a9","bg":"mokroye_tavern","sp":"grushenka","txt":"米嘉！你等等——这不是你做的，不是你！","lead":"","tail":"米嘉回头看了她一眼，没有说话。他被法警夹着，走出灯火通明的酒馆，走进清晨的冷风里。","rev":["grushenka"],"kn":"格鲁申卡当场喊冤；这是她的主观立场，不是客观结论。","cast":["grushenka"],"srcIds":["b_s11_b3","b_s11_b4"]},{"id":"b_s12_b1","sc":"b_s12","arc":"a9","bg":"investigation_room","sp":"narrator","txt":"城里警察局的小屋里，灯一直亮到天亮。预审推事把桌子擦干净，摊开笔录。","lead":"","tail":"","rev":["kirillovitch","nikolay_parfenovitch"],"kn":"客观：预审开始。","cast":["nikolay_parfenovitch","dmitri","kirillovitch"],"srcIds":["b_s12_b1"]},{"id":"b_s12_b2","sc":"b_s12","arc":"a9","bg":"investigation_room","sp":"nikolay_parfenovitch","txt":"德米特里·费奥多罗维奇，你父亲昨夜被人用黄铜研杵砸死在花园里。格里戈里重伤未死。你有什么要说？","lead":"","tail":"","rev":[],"kn":"客观事实（经验尸与证人确认）：费奥多尔死于头部重击；格里戈里被同一件凶器击伤但幸存。","cast":["nikolay_parfenovitch","dmitri","kirillovitch"],"srcIds":["b_s12_b2"]},{"id":"b_s12_b3","sc":"b_s12","arc":"a9","bg":"investigation_room","sp":"dmitri","txt":"格里戈里活着？……那好。我打了他，我不否认。但我没杀父亲！我砸了格里戈里之后就翻墙跑了，我连父亲的屋门都没进去。","lead":"","tail":"","rev":["dmitri"],"kn":"米嘉自述：他承认打了格里戈里，否认杀害父亲。这是他的口供，不等于客观结论。","cast":["nikolay_parfenovitch","dmitri","kirillovitch"],"srcIds":["b_s12_b3"]},{"id":"b_s12_b4","sc":"b_s12","arc":"a9","bg":"investigation_room","sp":"kirillovitch","txt":"那你在莫克罗耶花的那三千卢布，是哪儿来的？卡捷琳娜·伊万诺芙娜不是说，你只带走了她寄给她姨母的三千吗？","lead":"","tail":"","rev":[],"kn":"客观：卡捷琳娜曾交给米嘉三千卢布托她转交。他在莫克罗耶一夜挥霍掉的数目，远超过他身上合理所有。","cast":["nikolay_parfenovitch","dmitri","kirillovitch"],"srcIds":["b_s12_b4"]},{"id":"b_s12_b5","sc":"b_s12","arc":"a9","bg":"investigation_room","sp":"dmitri","txt":"那三千我八月份跟格鲁申卡去莫克罗耶时花了一半！剩下的一半，我缝在一个小布袋里，挂在脖子上——我羞于花它，我准备还给卡捷琳娜！你们去搜，搜出来！","lead":"","tail":"他不知道那布袋此刻在谁手里。预审推事和检察官交换了一个眼神。窗外，天已经亮了。","rev":[],"kn":"米嘉自述：他说另一半缝在胸前布袋里。这一说法是否属实，只有等到开庭对质，才能见分晓。","cast":["nikolay_parfenovitch","dmitri","kirillovitch"],"srcIds":["b_s12_b5","b_s12_b6"]},{"id":"s-c1b1","sc":"s-c1","arc":"a10","bg":"town_ditch_bridge","sp":"narrator","txt":"长老下葬那天傍晚，阿辽沙走过米哈伊洛夫斯基街口的小桥，看见一群放学的小学生，每个人兜里都鼓鼓地揣着石子。沟对面一个瘦小的男孩独自站着，脸色苍白，又大又黑的眼睛闪着敌意，兜里全是石子。","lead":"","tail":"","rev":["ilyusha"],"kn":"阿辽沙在街头遇见孩子群。","cast":["alyosha"],"srcIds":["s-c1b1","s-c1b2"]},{"id":"s-c1b3","sc":"s-c1","arc":"a10","bg":"town_ditch_bridge","sp":"alyosha","txt":"你们六个打一个，不害臊吗？会打死人的。","lead":"","tail":"伊柳沙先一石子砸在阿辽沙肩上，又扑上来死死咬住他的手指，咬到见血才松口。","rev":[],"kn":"阿辽沙上前劝架。","cast":["alyosha"],"srcIds":["s-c1b3","s-c1b4"]},{"id":"s-c1b5","sc":"s-c1","arc":"a10","bg":"town_ditch_bridge","sp":"alyosha","txt":"你看，我把你咬成这样了。我到底哪里对不起你？","lead":"","tail":"伊柳沙哇地哭出来，一路跑远。阿辽沙下定决心：要弄清这孩子为什么这么恨他。","rev":[],"kn":"阿辽沙不还手，只问缘故。","cast":["alyosha"],"srcIds":["s-c1b5","s-c1b6"]},{"id":"s-c2b1","sc":"s-c2","arc":"a10","bg":"snegiryov_room","sp":"narrator","txt":"阿辽沙按地址找到上尉家。一间又挤又破的农舍：俄式炉子、绳子上晾着破布、两张铺着拼布被的床。","lead":"","tail":"","rev":[],"kn":"上尉一家穷到叮当响。","cast":["snegiryov","alyosha"],"srcIds":["s-c2b1"]},{"id":"s-c2b2","sc":"s-c2","arc":"a10","bg":"snegiryov_room","sp":"snegiryov","txt":"请坐，先生——就像老喜剧里说的，请坐。","lead":"","tail":"屋里还有黄脸病弱的太太、刻薄的女儿瓦尔瓦拉、腿驼背驼的年轻姑娘，都冷冷打量阿辽沙。","rev":["snegiryov"],"kn":"这就是被德米特里在酒馆揪过胡子的上尉。","cast":["snegiryov","alyosha"],"srcIds":["s-c2b2","s-c2b3"]},{"id":"s-c2b4","sc":"s-c2","arc":"a10","bg":"snegiryov_room","sp":"snegiryov","txt":"我儿子那天在广场上吻了你哥哥的手，求他原谅我。从那天起，同学就叫他'破麻屑'，他就一病不起。","lead":"","tail":"里床上，伊柳沙瘦得脱了形，看见阿辽沙立刻扭过脸去。","rev":[],"kn":"伊柳沙是为父亲出头，恨所有卡拉马佐夫。","cast":["snegiryov","alyosha"],"srcIds":["s-c2b4","s-c2b5"]},{"id":"s-c2b6","sc":"s-c2","arc":"a10","bg":"snegiryov_room","sp":"alyosha","txt":"你等着。我哥哥会亲自来，当面向你道歉。","lead":"","tail":"","rev":[],"kn":"阿辽沙许下了这个承诺。","cast":["snegiryov","alyosha"],"srcIds":["s-c2b6"]},{"id":"s-c3b1","sc":"s-c3","arc":"a10","bg":"kolya_street","sp":"narrator","txt":"十三岁的科利亚·克拉索特金是全城最自负的小学生，训出一条会装死的狗，叫'佩列兹旺'。","lead":"","tail":"","rev":["krassotkin"],"kn":"科利亚聪明、傲气，是伊柳沙唯一的朋友。","cast":["krassotkin"],"srcIds":["s-c3b1"]},{"id":"s-c3b2","sc":"s-c3","arc":"a10","bg":"snegiryov_room","sp":"krassotkin","txt":"我不是小孩子，我懂政治，也懂科学。","lead":"","tail":"科利亚一直不敢去看伊柳沙，因为全班都在骂他；今天他终于踏进这间小屋。伊柳沙看见科利亚，气都喘不上来，伸手握住他的手。围在床边的孩子们都安静了。几天后，伊柳沙死了。上尉扑在小尸体上，疯了似的不肯放。","rev":[],"kn":"他故意装成熟，其实还是个孩子。","cast":["krassotkin"],"srcIds":["s-c3b2","s-c3b3","s-c3b4","s-c3b5"]},{"id":"psx15b1","sc":"p-supp-xi15","arc":"a11","bg":"hospital_room","sp":"narrator","txt":"预审之后，伊万病倒了；他与卡捷琳娜早已互相折磨，又彼此牵扯不清。阿辽沙来看二哥，转达卡捷琳娜的话，也带来莉兹近来古怪自轻的消息。伊万心里那个念头越来越压不住：父亲死的那夜，自己其实早知道、甚至默许了什么。他临行前斯乜尔佳科夫那句意味深长的话，一遍遍在耳边回响；他终于下定决心，再去见那个厨子。","lead":"","tail":"","rev":[],"kn":"伊万与卡捷琳娜关系扭曲。","cast":["ivan"],"srcIds":["psx15b1","psx15b2","psx15b3","psx15b4"]},{"id":"psx15b5","sc":"p-supp-xi15","arc":"a11","bg":"hospital_room","sp":"ivan","txt":"不是你……不，就是他。伊万喃喃着，掀被下床。","lead":"","tail":"这场病里的每一步，都把他逼向那间小屋里的最后对质。","rev":[],"kn":"他要去对质。","cast":["ivan"],"srcIds":["psx15b5","psx15b6"]},{"id":"s-c4b1","sc":"s-c4","arc":"a11","bg":"smerdyakov_lodge","sp":"narrator","txt":"父亲被杀后，伊万回到城里。他做的第一件事，就是去找仆役斯乜尔佳科夫。斯乜尔佳科夫二十四岁，脸黄皱、显老，是个癫痫病人；如今装病躺在里屋，老夫妇守在一边。","lead":"","tail":"","rev":["smerdyakov"],"kn":"伊万怀疑这个仆人。","cast":["ivan","smerdyakov"],"srcIds":["s-c4b1","s-c4b2"]},{"id":"s-c4b3","sc":"s-c4","arc":"a11","bg":"smerdyakov_lodge","sp":"ivan","txt":"那天夜里，到底发生了什么？","lead":"","tail":"","rev":[],"kn":"伊万直接质问。","cast":["ivan","smerdyakov"],"srcIds":["s-c4b3"]},{"id":"s-c4b4","sc":"s-c4","arc":"a11","bg":"smerdyakov_lodge","sp":"smerdyakov","txt":"我癫痫发作，倒在篱笆底下，什么都不知道。","lead":"","tail":"伊万第一次来，什么都没问出来。但他甩不掉一种直觉：这个人在撒谎。","rev":[],"kn":"他什么都不认。","cast":["ivan","smerdyakov"],"srcIds":["s-c4b4","s-c4b5"]},{"id":"s-c5b1","sc":"s-c5","arc":"a11","bg":"smerdyakov_lodge","sp":"narrator","txt":"隔了几天，伊万第二次来。这次他逼得更紧。","lead":"","tail":"","rev":[],"kn":"伊万不肯放手。","cast":["smerdyakov","ivan"],"srcIds":["s-c5b1"]},{"id":"s-c5b2","sc":"s-c5","arc":"a11","bg":"smerdyakov_lodge","sp":"smerdyakov","txt":"你当时不就是希望你父亲早点死吗？","lead":"","tail":"","rev":[],"kn":"他开始反咬。","cast":["smerdyakov","ivan"],"srcIds":["s-c5b2"]},{"id":"s-c5b3","sc":"s-c5","arc":"a11","bg":"smerdyakov_lodge","sp":"ivan","txt":"住嘴。我……我是个卑鄙的人。","lead":"","tail":"","rev":[],"kn":"伊万心里确实盼过父亲死——这一点他自己清楚。","cast":["smerdyakov","ivan"],"srcIds":["s-c5b3"]},{"id":"s-c5b4","sc":"s-c5","arc":"a11","bg":"smerdyakov_lodge","sp":"smerdyakov","txt":"我什么都没干。是你自己心里明白。","lead":"","tail":"伊万离开时，这句话像钉子一样扎在他脑子里。","rev":[],"kn":"他不招，也不放。","cast":["smerdyakov","ivan"],"srcIds":["s-c5b4","s-c5b5"]},{"id":"s-c6b1","sc":"s-c6","arc":"a11","bg":"smerdyakov_lodge","sp":"narrator","txt":"第三次来，斯乜尔佳科夫从床上坐起来，不再装病了。","lead":"","tail":"","rev":[],"kn":"摊牌的时候到了。","cast":["smerdyakov","ivan"],"srcIds":["s-c6b1"]},{"id":"s-c6b2","sc":"s-c6","arc":"a11","bg":"smerdyakov_lodge","sp":"smerdyakov","txt":"是我杀的。钱是我拿的。可你呢？你明知道我会动手，你故意躲开——你才是主谋。","lead":"","tail":"那卷三千卢布就在桌上，是父亲的买命钱。","rev":[],"kn":"他自认杀人。","cast":["smerdyakov","ivan"],"srcIds":["s-c6b2","s-c6b3","s-c6b4"]},{"id":"s-c6b5","sc":"s-c6","arc":"a11","bg":"smerdyakov_lodge","sp":"ivan","txt":"……我没有动手。可我盼过他死。","lead":"","tail":"","rev":[],"kn":"伊万承认的是自己灵魂的罪，不是动手杀人。","cast":["smerdyakov","ivan"],"srcIds":["s-c6b5"]},{"id":"s-c6b6","sc":"s-c6","arc":"a11","bg":"smerdyakov_lodge","sp":"smerdyakov","txt":"你去法庭上说吧。我什么都不认。","lead":"","tail":"","rev":[],"kn":"唯一的证人不肯出庭作证。","cast":["smerdyakov","ivan"],"srcIds":["s-c6b6"]},{"id":"s-c7b1","sc":"s-c7","arc":"a11","bg":"ivan_rooms","sp":"narrator","txt":"伊万回到自己租的小屋，发烧。夜里，一个穿黄褐色外套的小绅士敲门进来做客。","lead":"","tail":"","rev":["devil"],"kn":"这是伊万高烧中的幻象。","cast":["devil","ivan"],"srcIds":["s-c7b1"]},{"id":"s-c7b2","sc":"s-c7","arc":"a11","bg":"ivan_rooms","sp":"devil","txt":"我就是你心里那个又俗气又琐碎的小鬼。你不是说没有不朽就没有美德吗？那你现在为什么还痛苦？","lead":"","tail":"","rev":[],"kn":"他是伊万的投影，不是外部实体。","cast":["devil","ivan"],"srcIds":["s-c7b2","s-c7b3"]},{"id":"s-c7b4","sc":"s-c7","arc":"a11","bg":"ivan_rooms","sp":"ivan","txt":"你就是我！滚出去！","lead":"","tail":"铜器穿过小绅士的影子，他消失了。伊万醒来，满头冷汗。","rev":[],"kn":"伊万知道他是自己。","cast":["devil","ivan"],"srcIds":["s-c7b4","s-c7b5"]},{"id":"s-c8b1","sc":"s-c8","arc":"a11","bg":"smerdyakov_lodge","sp":"narrator","txt":"第二天一早，有人敲门：斯乜尔佳科夫在自己小屋里上吊死了。桌上留一张字条，字迹歪歪扭扭：'按我自己的意愿毁灭自己，请勿怪罪任何人。'","lead":"","tail":"","rev":[],"kn":"证人死了。","cast":["ivan"],"srcIds":["s-c8b1","s-c8b2"]},{"id":"s-c8b3","sc":"s-c8","arc":"a11","bg":"smerdyakov_lodge","sp":"ivan","txt":"……他最后把那件事，已经告诉别人了。","lead":"","tail":"伊万被人扶回住处，从此一病不起。","rev":[],"kn":"伊万知道法庭上他跑不掉。","cast":["ivan"],"srcIds":["s-c8b3","s-c8b4"]},{"id":"s-c9b1","sc":"s-c9","arc":"a12","bg":"court","sp":"narrator","txt":"开庭那天，旁听席挤得水泄不通。伊万穿一身黑，坐在被告席后面。老仆人格里戈里出庭作证：他看见德米特里冲进花园，一铜杵把他打倒，手里还攥着那东西。医生们上台作证，争论德米特里是不是疯子；一袋花生成了旁听席的笑料。","lead":"","tail":"","rev":[],"kn":"庭审开始。","cast":["dmitri","grigory"],"srcIds":["s-c9b1","s-c9b2","s-c9b3"]},{"id":"s-c9b4","sc":"s-c9","arc":"a12","bg":"court","sp":"katerina","txt":"我提交这封信——是德米特里亲笔写的。","lead":"","tail":"那是德米特里喝醉时写的：他明明白白写着，他要杀父亲，抢走那三千卢布。旁听席嗡嗡作响；德米特里在被告席上浑身发抖。","rev":["katerina"],"kn":"卡捷琳娜出庭。","cast":["katerina"],"srcIds":["s-c9b4","s-c9b5","s-c9b6"]},{"id":"s-c10b1","sc":"s-c10","arc":"a12","bg":"court","sp":"kirillovitch","txt":"这是两代卡拉马佐夫式的放纵撞在一起！他父亲是色鬼，他儿子是暴徒——杀人是必然的。","lead":"","tail":"检察官把全城各色人等一一画成漫画，最后套上'三驾马车'的比喻，旁听席听得入神。","rev":["kirillovitch"],"kn":"【控方主张】激情杀人、必然如此。","cast":["kirillovitch","fetyukovitch"],"srcIds":["s-c10b1","s-c10b2"]},{"id":"s-c10b3","sc":"s-c10","arc":"a12","bg":"court","sp":"fetyukovitch","txt":"那笔钱——三千卢布——真的存在过吗？谁亲眼见过？既然没有钱，就没有抢劫。既然没有抢劫—— ——也就谈不上杀人。那真正的凶手是谁？是那个上吊的仆人。","lead":"","tail":"旁听席有人鼓掌，有人嘘。整个法庭被两篇讲稿撕扯成两半。","rev":["fetyukovitch"],"kn":"【辩方主张】钱的事根本说不清。","cast":["kirillovitch","fetyukovitch"],"srcIds":["s-c10b3","s-c10b4","s-c10b5","s-c10b6"]},{"id":"s-c11b1","sc":"s-c11","arc":"a12","bg":"court","sp":"narrator","txt":"陪审团退席，过了漫长的一小时。整个大厅静得能听见钟摆。庭长宣读：谋杀父亲——有罪；抢劫——有罪。","lead":"","tail":"","rev":[],"kn":"判决要下来了。","cast":["dmitri"],"srcIds":["s-c11b1","s-c11b2"]},{"id":"s-c11b3","sc":"s-c11","arc":"a12","bg":"court","sp":"dmitri","txt":"我没杀父亲！我认罪的是我的灵魂，不是这件事！","lead":"","tail":"法警给他戴上镣铐，把他从被告席带下去。旁听席一片唏嘘。","rev":[],"kn":"德米特里不服。","cast":["dmitri"],"srcIds":["s-c11b3","s-c11b4"]},{"id":"s-c12b1","sc":"s-c12","arc":"a12","bg":"hospital_ivan","sp":"narrator","txt":"判决后，几个朋友偷偷凑钱，商量让德米特里在流放途中逃到美国去。德米特里本人在犹豫：走，还是按判决上路？伊万一直发烧说胡话。卡捷琳娜守在他床边，两人之间隔着没说出口的话。","lead":"","tail":"","rev":[],"kn":"【这只是一个计划】路线、钱、接应都还没落实。","cast":["ivan","alyosha"],"srcIds":["s-c12b1","s-c12b2","s-c12b3"]},{"id":"s-c12b4","sc":"s-c12","arc":"a12","bg":"hospital_ivan","sp":"ivan","txt":"如果我兄弟真要逃……我不能拦他。","lead":"","tail":"伊万望着天花板，许久没有作声。窗外的小城渐渐入夜，那个计划再没有人提起。","rev":[],"kn":"伊万的态度。","cast":["ivan"],"srcIds":["s-c12b4","s-c12b5"]},{"id":"s-c13b1","sc":"s-c13","arc":"a12","bg":"cemetery_stone","sp":"narrator","txt":"伊柳沙下葬那天，全班同学都来了。上尉扑在小棺材上，哭得站不起来。","lead":"","tail":"","rev":[],"kn":"葬礼。","cast":["snegiryov","ilyusha","alyosha","krassotkin"],"srcIds":["s-c13b1"]},{"id":"s-c13b2","sc":"s-c13","arc":"a12","bg":"cemetery_stone","sp":"alyosha","txt":"跟我来，到那块大石头那儿去。我们都爱过伊柳沙这个孩子。以后不管我们变成什么样，都不要忘记今天。我们也许会做坏事，会笑别人。但只要记得伊柳沙的葬礼，心里就还存着一点善。","lead":"","tail":"","rev":[],"kn":"就是 s-c1 那块大石头。","cast":["alyosha","krassotkin"],"srcIds":["s-c13b2","s-c13b3","s-c13b4"]},{"id":"s-c13b5","sc":"s-c13","arc":"a12","bg":"cemetery_stone","sp":"krassotkin","txt":"我们记得卡拉马佐夫！","lead":"","tail":"阿辽沙心里回答：是的，我要永远记得他——和你们一起。","rev":[],"kn":"孩子们齐声应和。","cast":["alyosha","krassotkin"],"srcIds":["s-c13b5","s-c13b6"]}]

 var shownIntro={};
 function portSrc(id){var el=document.querySelector('.port-img[data-p="'+id+'"]');return el?el.src:null;}
 function clearIntroCards(){stack.innerHTML="";}
 function makeIntroCard(id){
   var c=document.createElement("div");c.className="introCard";
   var s=portSrc(id);
   c.innerHTML='<div class="icp">'+(s?'<img src="'+s+'" alt="" style="object-position:'+(FACE_POS[id]||'50% 38%')+'">':'')+'</div>'+
    '<div class="ict"><div class="ictTag">初登场</div><h4></h4><div class="ict2"></div><p></p></div>';
   c.querySelector("h4").textContent=(window.NAME_CANON_SHORT&&NAME_CANON_SHORT[id])||shortPersonName(id);
   c.querySelector(".ict2").textContent=CHAR_TITLE[id]||"";
   var fm=(window.STORY_EXTRAS&&STORY_EXTRAS.firstMeet&&STORY_EXTRAS.firstMeet[id])||CHAR_IDENTITY[id]||"";
   c.querySelector("p").textContent=fm;
   c.addEventListener("click",function(ev){ev.stopPropagation();openGameCodex(id);});
   var sec=6+Math.min(6,fm.length*0.06);
   var t=setTimeout(function(){c.classList.add("gone");setTimeout(function(){if(c.parentNode)c.remove();},300);},sec*1000);
   c.addEventListener("mouseenter",function(){clearTimeout(t);c._t=null;});
   c.addEventListener("mouseleave",function(){if(!c._t)c._t=setTimeout(function(){c.classList.add("gone");},1500);});
   stack.appendChild(c);
   setTimeout(function(){c.classList.add("show");},30);
 }

 var recentMet=[];

 // 钩子：renderBeat 后触发初登场 + 短名字牌 + 进度行
 var _rb=renderBeat;
 renderBeat=function(){
   _rb.apply(this,arguments);
   try{
     clearIntroCards();
     var b=BEATS[state.idx];if(!b)return;
     var curIdx=state.idx;
     var cx=UICTX.beatContext[b.id]||{};
     var ppl=(cx.focus||[]).slice();
     if(b.sp&&b.sp!=="narrator"&&ppl.indexOf(b.sp)<0)ppl.push(b.sp);
     ppl.forEach(function(id){if(FIRST_ON_STAGE[id]===state.idx){if(!shownIntro[id]){shownIntro[id]=1;recentMet.unshift(id);recentMet=recentMet.slice(0,6);setTimeout(function(){if(state.idx===curIdx)makeIntroCard(id);},1700);}}});
     // 短名字牌
     if(b.sp&&b.sp!=="narrator"){var nm=document.getElementById("name");nm.textContent=shortPersonName(b.sp);
       var fa=document.querySelector("#focus .fp .ava img");if(fa&&FACE_POS[b.sp])fa.style.objectPosition=FACE_POS[b.sp];}
     // 常驻进度行
     var ai=ARCS.findIndex(function(a){return a.id===b.arc;});
     var pl=document.getElementById("progLine");
     if(!pl){pl=document.createElement("div");pl.id="progLine";document.getElementById("topBar").appendChild(pl);}
     pl.textContent="第"+["一","二","三","四","五","六","七","八","九","十","十一","十二"][ai]+"篇 · "+(ai>=0?ARCS[ai].title:"")+" · "+(state.idx+1)+"/"+BEATS.length;
   }catch(e){console.warn("v17hook",e);}
 };

 // 接影神图模块
 function cxProgress(){
   var sc=(BEATS[state.idx]||{}).sc||ARCS[0].startScene;
   var n=1;for(var i=0;i<ARCS.length;i++){if(scIndexOf(ARCS[i].startScene)<=scIndexOf(sc))n=i+1;}
   return n;
 }
 function scIndexOf(sc){var m={};BEATS.forEach(function(b,i){if(!(b.sc in m))m[b.sc]=i;});return m[sc]!=null?m[sc]:0;}
 function cxMet(){var s=[];for(var k in FIRST_ON_STAGE){if(FIRST_ON_STAGE[k]<=state.idx)s.push(k);}return s;}
 // 标题页零进度时禁用「人物」
 (function(){
   var el=document.getElementById("mCodexTitle");
   if(el){
     var hasProgress=(typeof load==="function");
     var saved=null;try{saved=JSON.parse(localStorage.getItem("karamazov_vn_full_v3")||"null");}catch(e){}
     if(!saved){el.disabled=true;el.style.opacity=.35;el.style.cursor="not-allowed";}
     el.addEventListener("click",function(e){
       if(el.disabled){e.stopPropagation();e.preventDefault();return;}
       if(typeof openCodex==="function")openCodex(cxProgress(),cxMet());
     },true);
   }
 })();
 // 统一图鉴入口：从当前 state 自算 arc/met，可带焦点人物
 function openGameCodex(focusId){
   var arc=cxProgress();var met=cxMet();

window.STORY_EXTRAS={"hook": "一座小城里，一个父亲和三个儿子，把爱与恨都烧到了底。", "chapters": [{"id": "a1", "title": "第一部 · 家族往事", "intro": "一座空荡老宅，三个被父亲丢下的儿子先后长大。", "summary": {"what": "费奥多尔两度丧妻，攒下十万卢布却吝啬出丑；米嘉由老仆养大，成年回家讨还母亲遗产；阿辽沙入修道院做见习修士，师从佐西马长老。", "newChars": ["fyodor", "grigory", "dmitri", "alyosha", "zosima"], "relations": "米嘉与父亲结下争产积怨；阿辽沙与长老结成师徒。"}}, {"id": "a2", "title": "第二部 · 意外的聚会", "intro": "一次修道院会面，把全城体面人搅进同一间屋。", "summary": {"what": "众人赴修道院见长老；费奥多尔席间扮丑，与米乌索夫当众顶撞；迟到的米嘉闯进来与父亲撕破脸；长老忽然伏地向米嘉一拜，斋堂不欢而散。", "newChars": ["miusov", "kalganov", "maximov", "peasant", "khokhlakov", "lise", "ivan", "librarian"], "relations": "父子当众互揭短；长老对米嘉生出怜悯；伊万第一次开口论辩。"}}, {"id": "a3", "title": "第三部 · 感官者", "intro": "父亲与长子，如今为同一个女人反目。", "summary": {"what": "仆人小屋里说起厨子斯乜尔佳科夫的身世；米嘉夜下向阿辽沙剖白往事，又与父亲同争格鲁申卡；他当面向未婚妻卡捷琳娜悔婚，被她掷钱还债。", "newChars": ["grushenka", "katerina"], "relations": "父子争同一女；米嘉与卡捷琳娜走到决裂边缘；米嘉向阿辽沙倾吐心事。"}}, {"id": "a4", "title": "第四部 · 刺痛", "intro": "长老病危，一个被羞辱的上尉家藏着孩子的心。", "summary": {"what": "阿辽沙随侍临终的长老；他受托周济上尉家，钱被摔在地上；小学校园里他为被围攻的伊柳沙出头；霍赫拉科娃家，莉兹偷偷塞给他一张纸条。", "newChars": ["snegiryov", "ilyusha"], "relations": "阿辽沙与伊柳沙初遇；阿辽沙向上尉许下和解之诺；莉兹对阿辽沙生出心事。"}}, {"id": "a5", "title": "第五部 · 叛逆与宗教大法官", "intro": "两兄弟酒馆彻夜长谈：一个退回世界，一个讲了个吻的故事。", "summary": {"what": "伊万与阿辽沙交心，说出拒受这个世界的叛逆；他借宗教大法官之口讲完长诗，基督无言一吻，阿辽沙以吻回敬兄长；厨子暗中撺掇伊万离城。", "newChars": ["smerdyakov"], "relations": "兄弟交心却立场对立，终以一吻相和；斯乜尔佳科夫开始凑近伊万。"}}, {"id": "a6", "title": "第六部 · 俄罗斯修士", "intro": "长老弥留之际，把一生的道理留给最年轻的弟子。", "summary": {"what": "长老追述从军与决斗的一生，被一句话点醒；他嘱咐阿辽沙不要离开修道院，也不要恨这世界，要不停歇地爱人。", "newChars": [], "relations": "师徒之间完成最后的托付。"}}, {"id": "a7", "title": "第七部 · 阿辽沙", "intro": "长老的遗体没有散香，年轻人心里的柱子塌了。", "summary": {"what": "长老遗体出现腐味，拉基金带阿辽沙下山；格鲁申卡给他一颗核桃，露出柔软一面；阿辽沙在棺旁梦见迦拿的婚宴，醒来泪如雨下，重新站稳。", "newChars": ["rakitin"], "relations": "格鲁申卡对阿辽沙卸下心防；阿辽沙经梦境重立信念。"}}, {"id": "a8", "title": "第八部 · 米嘉", "intro": "三千卢布像一团火，烧得米嘉连夜翻过一道矮墙。", "summary": {"what": "米嘉求老商人借钱被耍，连夜赶路一无所获；他夜潜父亲花园，老仆格里戈里扑出擒他，被他一研杵击倒；他换钱后直奔莫克罗耶买醉。", "newChars": ["samsonov", "perhotin"], "relations": "老仆与 .cx-cards{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.cx-card{
  width:118px;cursor:default;flex:0 0 auto;
}
.cx-card.is-featured{width:168px}

  transition:transform .25s ease, filter .25s ease}
.cx-card:not(.is-locked):hover .cx-card-fig img{transform:scale(1.04);filter:saturate(.95) brightness(1)}
.cx-card-fig::after{ /* 底部渐变托字 */
  content:"";position:absolute;inset:auto 0 0 0;height:45%;
  background:linear-gradient(transparent,#0c0905e8);pointer-events:none;
}
.cx-card:not(.is-locked){cursor:pointer}
.cx-card:not(.is-locked):hover .cx-card-fig{border-color:var(--cx-brass)}
.cx-card:not(.is-locked):active .cx-card-fig{transform:translateY(1px)}
.cx-card-meta{position:relative;text-align:center;padding:7px 2px 0}
.cx-card-name{font-size:14px;letter-spacing:.12em;color:var(--cx-paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-card-title{font-size:11px;color:var(--cx-paper-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* 未结识剪影卡 */
.cx-card.is-locked .cx-card-fig{
  background:

}
.cx-silhouette{

}
.cx-silhouette .qm{font-size:44px;line-height:1;font-weight:600;color:#4a3f2a}
.cx-silhouette .lbl{font-size:11px;letter-spacing:.25em;color:#55492f}

.cx-frame{position:relative;aspect-ratio:600/824;width:100%;max-width:320px;margin:0 auto}
.cx-frame-portrait{

.cx-info-title{

.cx-info-first{margin-top:14px;font-size:13.5px;line-height:1.9;color:var(--cx-paper-dim)}

.cx-bio h4{font-size:13px;letter-spacing:.4em;color:var(--cx-paper-faint);font-weight:600;margin-bottom:12px}
.cx-bio p{font-size:14px;line-height:2.1;margin-bottom:12px;text-align:justify;color:var(--cx-paper)}

}

}
.cx-node .av{

/* ================= 渲染：关系网 ================= */
var NET_W=1200, NET_H=760;
function buildNetworkData(){
  // 分区行布局
  var bands=FACTION_ORDER.map(function(fa){
    var chars=CHAR_DATA.filter(function(c){return c.faction===fa;});
    return {fa:fa, chars:chars};
  }).filter(function(b){return b.chars.some(function(c){return isMet(c.id);});});
  var rowH=NET_H/(bands.length+1);
  var nodes={};
  var bandIds=bands.map(function(b){return b.chars.filter(function(c){return isMet(c.id);}).map(function(c){return c.id;});});
  // 边（去重，未解锁不画）先建表，供排序用
  var seen={}, edges=[];
  CHAR_DATA.forEach(function(c){
    c.bonds.forEach(function(b){
      if(!bondUnlocked(c,b))return;
      var key=[c.id,b[1]].sort().join("|");
      if(seen[key])return; seen[key]=1;
      edges.push({a:c.id,b:b[1],label:b[2],type:b[3]});
    });
  });
  var adj={};
  bandIds.forEach(function(m){m.forEach(function(id){adj[id]=[];});});
  edges.forEach(function(e){
    if(adj[e.a]&&adj[e.b]){adj[e.a].push(e.b);adj[e.b].push(e.a);}
  });
  function place(){
    bandIds.forEach(function(m,bi){
      var n=m.length;
      m.forEach(function(id,i){
        nodes[id]={id:id, x:(n===1?NET_W/2:90+(NET_W-180)*(i/(n-1))), y:rowH*(bi+1), faction:bands[bi].fa};
      });
    });
  }
  function meanX(id){
    var xs=adj[id].map(function(o){return nodes[o]?nodes[o].x:null;}).filter(function(v){return v!=null;});
    return xs.length? xs.reduce(function(a,b){return a+b;},0)/xs.length : null;
  }
  place();
  // barycenter 扫掠排序，减少连线交叉
  for(var it=0; it<10; it++){
    for(var bi=1; bi<bandIds.length; bi++){
      bandIds[bi].sort(function(a,b){
        var ma=meanX(a), mb=meanX(b);
        return (ma==null?-1:ma)-(mb==null?-1:mb);
      });
    }
    for(var bi2=bandIds.length-2; bi2>=0; bi2--){
      bandIds[bi2].sort(function(a,b){
        var ma=meanX(a), mb=meanX(b);
        return (ma==null?-1:ma)-(mb==null?-1:mb);
      });
    }
    place();
  }
  return {nodes:nodes,edges:edges};
}

  var wrap=el("div","cx-net-wrap");
  var svg='<svg class="cx-net-svg" viewBox="0 0 '+NET_W+' '+NET_H+'">';
  // 分区带 + 区名
  var seenF={};
  Object.keys(data.nodes).forEach(function(id){
    var nd=data.nodes[id];
    if(seenF[nd.faction])return; seenF[nd.faction]=1;
    svg+='<line class="cx-net-fband" x1="40" y1="'+nd.y+'" x2="'+(NET_W-40)+'" y2="'+nd.y+'"/>';
    svg+='<text class="cx-net-fname" x="48" y="'+(nd.y-26)+'">'+esc(nd.faction)+"</text>";
  });
  // 边
  data.edges.forEach(function(e,ei){
    var A=data.nodes[e.a],B=data.nodes[e.b]; if(!A||!B)return;
    var mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    var dx=B.x-A.x, dy=B.y-A.y, len=Math.sqrt(dx*dx+dy*dy)||1;
    var off=(ei%2?14:-14);
    var cx=mx+(-dy/len)*off, cy=my+(dx/len)*off;
    svg+='<path class="cx-net-edge" data-e="'+e.a+"|"+e.b+'" d="M'+A.x+" "+A.y+" Q"+cx+" "+cy+" "+B.x+" "+B.y+
         '" stroke="'+BOND_COLOR_HEX[e.type]+'"/>';
    svg+='<text class="cx-net-elabel" data-e="'+e.a+"|"+e.b+'" x="'+mx+'" y="'+(my-4)+'" text-anchor="middle">'+esc(e.label)+"</text>";
  });
  // 节点
  Object.keys(data.nodes).forEach(function(id){
    var nd=data.nodes[id], c=CH_BY_ID[id];
    svg+='<g class="cx-net-node" data-id="'+id+'" transform="translate('+nd.x+','+(nd.y+14)+')">'+
      '<circle r="24" fill="#1c160e" stroke="'+BOND_COLOR_HEX.family+'"/>'+
      '<defs></defs>'+
      '<image href="'+esc(portraitURL(id))+'" x="-19" y="-19" width="38" height="38" preserveAspectRatio="xMidYMid slice" clip-path="url(#cc-'+id+')"/>'+
      '<text class="nm" y="40">'+esc(c.short)+"</text></g>";
  });
  svg+="</svg>";
  wrap.innerHTML=svg;
  stage.appendChild(wrap);
  box.appendChild(stage);

  // clip paths（动态加）
  var defs=svg.querySelector?null:null;
  var svgEl=wrap.querySelector("svg");
  var d=document.createElementNS("http://www.w3.org/2000/svg","defs");
  Object.keys(data.nodes).forEach(function(id){
    var cp=document.createElementNS("http://www.w3.org/2000/svg","clipPath");
    cp.setAttribute("id","cc-"+id);
    var cir=document.createElementNS("http://www.w3.org/2000/svg","circle");
    cir.setAttribute("r","19");
    cp.appendChild(cir); d.appendChild(cp);
  });
  svgEl.insertBefore(d, svgEl.firstChild);

  // 节点点击
  wrap.querySelectorAll(".cx-net-node").forEach(function(g){
    g.addEventListener("click",function(ev){
      ev.stopPropagation();
      var id=g.getAttribute("data-id");
      S.netFocus=(S.netFocus===id)?null:id;
      paintNetworkHighlight();
    });
  });
  wrap.addEventListener("click",function(){S.netFocus=null;paintNetworkHighlight();});

  // 拖拽平移 + 缩放（移动超过阈值才捕获，避免吞掉节点点击）
  var drag=null, dragged=false;
  wrap.addEventListener("pointerdown",function(ev){
    drag={x:ev.clientX,y:ev.clientY,t:Object.assign({},S.netT),active:false};
  });
  wrap.addEventListener("pointermove",function(ev){
    if(!drag)return;
    if(!drag.active){
      if(Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)<6)return;
      drag.active=true; wrap.classList.add("dragging");
      try{wrap.setPointerCapture(ev.pointerId);}catch(e){}
    }
    S.netT.x=drag.t.x+(ev.clientX-drag.x);
    S.netT.y=drag.t.y+(ev.clientY-drag.y);
    applyNetTransform();
  });
  wrap.addEventListener("pointerup",function(){
    if(drag&&drag.active)dragged=true;
    drag=null; wrap.classList.remove("dragging");
  });
  wrap.addEventListener("click",function(ev){
    if(dragged){dragged=false;return;}
    if(ev.target.closest&&ev.target.closest(".cx-net-node"))return;
    S.netFocus=null; paintNetworkHighlight();
  });
  wrap.addEventListener("wheel",function(ev){
    ev.preventDefault();
    var factor=ev.deltaY<0?1.12:1/1.12;
    S.netT.k=Math.max(.4,Math.min(2.6,S.netT.k*factor));
    applyNetTransform();
  },{passive:false});
  // 双指缩放
  var pinch=null;
  wrap.addEventListener("touchstart",function(ev){
    if(ev.touches.length===2){
      pinch={d:touchDist(ev),k:S.netT.k};
    }
  },{passive:false});
  wrap.addEventListener("touchmove",function(ev){
    if(pinch&&ev.touches.length===2){
      ev.preventDefault();
      var d=touchDist(ev);
      S.netT.k=Math.max(.4,Math.min(2.6,pinch.k*d/pinch.d));
      applyNetTransform();
    }
  },{passive:false});
  wrap.addEventListener("touchend",function(){pinch=null;});

  applyNetTransform();
  paintNetworkHighlight();
}
function touchDist(ev){
  var a=ev.touches[0],b=ev.touches[1];
  return Math.sqrt((a.clientX-b.clientX)*(a.clientX-b.clientX)+(a.clientY-b.clientY)*(a.clientY-b.clientY));
}
function applyNetTransform(){
  var svg=document.querySelector("#cx-view-network .cx-net-svg");
  if(!svg)return;
  // 以视口中心为缩放原点：translate(NET_W/2,NET_H/2) scale translate back + pan
  svg.style.transformOrigin="0 0";
  var k=S.netT.k;
  svg.style.transform="translate("+S.netT.x+"px,"+S.netT.y+"px) scale("+k+")";
}
function paintNetworkHighlight(){
  var stage=document.querySelector("#cx-view-network .cx-network");
  if(!stage)return;
  var f=S.netFocus;
  stage.classList.toggle("dim",!!f);
  if(!f)return;
  // 直接关系人集合
  var data=buildNetworkData();
  var adj={}; adj[f]=1;
  data.edges.forEach(function(e){
    if(e.a===f)adj[e.b]=1; if(e.b===f)adj[e.a]=1;
  });
  stage.querySelectorAll(".cx-net-node").forEach(function(g){
    g.classList.toggle("hl",!!adj[g.getAttribute("data-id")]);
  });
  stage.querySelectorAll(".cx-net-edge,.cx-net-elabel").forEach(function(l){
    var key=l.getAttribute("data-e");
    var parts=key.split("|");
    l.classList.toggle("hl", parts.indexOf(f)>=0);
  });
}

/* ================= 视图切换 ================= */
function showView(v){
  S.view=v;
  document.getElementById("cx-view-gallery").hidden = v!=="gallery";
  document.getElementById("cx-view-detail").hidden  = v!=="detail";
  document.getElementById("cx-view-network").hidden  = v!=="network";
  document.getElementById("cx-btn-network").classList.toggle("is-active",v==="network");
  if(v==="gallery")renderGallery();
  if(v==="detail")renderDetail();
  if(v==="network"){S.netFocus=null;renderNetwork();}
}

/* ================= 对外 API ================= */
/* openCodex(progressArcIndex 1-12, metSet [id...] / Set, focusId?) */
window.openCodex=function(arc, metSet, focusId){
  S.arc=Math.max(1,Math.min(12, arc|0));
  S.met={};
  (metSet instanceof Set?Array.from(metSet):(metSet||[])).forEach(function(id){S.met[id]=1;});
  var n=0; for(var k in S.met)n++;
  document.getElementById("cx-met-n").textContent=n;
  S.stack=[]; S.netT={x:0,y:0,k:1}; S.netFocus=null;
  document.getElementById("codex-root").classList.add("cx-open");
  document.getElementById("codex-root").setAttribute("aria-hidden","false");
  if(focusId && S.met[focusId]){ S.stack=[focusId]; showView("detail"); }
  else showView("gallery");
};
window.openCharDetail=function(id){
  if(!S.met[id])return;
  if(S.stack[S.stack.length-1]!==id)S.stack.push(id);
  showView("detail");
};
window.openBondNetwork=function(){ showView("network"); };
window.closeCodex=function(){
  document.getElementById("codex-root").classList.remove("cx-open");
  document.getElementById("codex-root").setAttribute("aria-hidden","true");
};

/* 顶栏按钮 */
document.getElementById("cx-btn-close").addEventListener("click",window.closeCodex);
document.getElementById("cx-btn-network").addEventListener("click",function(){
  if(S.view==="network")showView(S.stack.length?"detail":"gallery");
  else showView("network");
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape")window.closeCodex();
});

var arcSlider=document.getElementById("demo-arc");
var arcTitle=document.getElementById("codex-arc-title");
function metByProgress(arc){
  var met={};
  CH_DATA.forEach(function(ch,i){
    if(i+1<=arc){
      // 与 story-extras.chapters.newChars 对齐
      var news=[
        ["fyodor","grigory","dmitri","alyosha","zosima"],
        ["miusov","kalganov","maximov","peasant","khokhlakov","lise","ivan","librarian"],
        ["grushenka","katerina"],
        ["snegiryov","ilyusha"],
        ["smerdyakov"],
        [],
        ["rakitin"],
        ["samsonov","perhotin"],
        ["kirillovitch","nikolay_parfenovitch"],
        ["krassotkin"],
        ["devil"],
        ["fetyukovitch"]
      ][i];
      news.forEach(function(id){met[id]=1;});
    }
  });
  return met;
}
function currentMet(){
  var mode=document.querySelector('input[name=demo-met]:checked').value;
  var arc=+arcSlider.value;
  if(mode==="all"){var all={};CHAR_DATA.forEach(function(c){all[c.id]=1;});return all;}
  return metByProgress(arc);
}
function syncDemo(){
  var arc=+arcSlider.value;
  arcTitle.textContent=CH_DATA[arc-1].title;
}
if(arcSlider){arcSlider.addEventListener("input",syncDemo);}
document.querySelectorAll('input[name=demo-met]').forEach(function(r){
  r.addEventListener("change",syncDemo);
});
var _demoOpen=document.getElementById("demo-open");
if(_demoOpen)_demoOpen.addEventListener("click",function(){
  var met=currentMet();
  openCodex(+arcSlider.value, Object.keys(met));
});
if(typeof syncDemo==="function"&&arcSlider)syncDemo();

/* 演示页初始化：若带 ?focus=dmitri&arc=3&met=all 则自动打开 */
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get("auto")){
    var arc=+(q.get("arc")||2);
    arcSlider.value=arc; syncDemo();
    var met = q.get("met")==="all"?null:currentMet();
    if(q.get("met")==="all"){var all={};CHAR_DATA.forEach(function(c){all[c.id]=1;});met=all;}
    openCodex(arc, Object.keys(met||{}), q.get("focus")||undefined);
  }
})();

})();
</script>
